<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Avvento">
<title>Calendario dell'Avvento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --notte:#0d0b2a; --indaco:#2a2668; --lilla:#c9c6f5; --lilla-chiaro:#e8e6ff;
  --rosa:#c85a7c; --pesca:#e3a979; --oro:#ffd98a; --carta:#f6f3ff; --inchiostro:#1c1946;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
html{background:#0d0b2a;-webkit-tap-highlight-color:transparent}
@media (display-mode: standalone){ body{user-select:none;-webkit-user-select:none;overscroll-behavior:none} }
body{
  font-family:'Jost',system-ui,sans-serif; background:var(--notte); color:var(--lilla-chiaro);
  display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100%;
  overflow-x:hidden;
}

/* ---------- scena ---------- */
.cornice{width:100%;max-width:calc(100svh * 16 / 9);overflow:hidden;position:relative;flex:none}
.scena{position:relative;width:100%;aspect-ratio:1920/1080;transition:filter .8s}
.scena > img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
/* luna piena (accendendo la luna lo spicchio diventa tondo) */
.scena{container-type:inline-size}
.luna-piena{position:absolute;left:33.89%;top:17.12%;width:5.52%;aspect-ratio:1;border-radius:50%;pointer-events:none;
  transform:translate(-50%,-50%) scale(.92);opacity:0;transition:opacity 1.4s ease, transform 1.4s cubic-bezier(.3,1.4,.5,1);
  background:
    radial-gradient(circle at 30% 56%, rgba(196,184,240,.55) 0 7%, transparent 8.5%),
    radial-gradient(circle at 41% 71%, rgba(196,184,240,.45) 0 9%, transparent 10.5%),
    radial-gradient(circle at 23% 40%, rgba(196,184,240,.4) 0 4.5%, transparent 6%),
    radial-gradient(circle at 63% 36%, rgba(196,184,240,.35) 0 6%, transparent 7.5%),
    radial-gradient(circle at 70% 66%, rgba(196,184,240,.3) 0 4.5%, transparent 6%),
    radial-gradient(circle at 38% 34%, #fdfbff 0%, #f0e9fe 45%, #e3d9fb 100%);
  box-shadow:0 0 1.6cqw .5cqw rgba(232,222,255,.75), 0 0 5cqw 1.5cqw rgba(190,175,255,.35)}
.scena.luna-on .luna-piena{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* luna: chiaro di luna */
.lunare{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1s;mix-blend-mode:screen;
  background:radial-gradient(30% 45% at 33.6% 17%, rgba(225,215,255,.55), rgba(160,150,255,.12) 55%, transparent 80%)}
.scena.luna-on .lunare{opacity:1}
.scena.luna-on > img,.scena.luna-on #case{filter:brightness(1.12) saturate(1.08)}
#case{transition:filter 1s}
.scena > img{transition:filter 1s}

/* lucine sulle ghirlande (lampadina): due combinazioni che si alternano */
.scena > img.ghirlanda{pointer-events:none;opacity:0;transition:opacity .4s,filter 1s}
.scena.luci-on .ghirlanda.a{animation:lampeggiaA 1.6s infinite}
.scena.luci-on .ghirlanda.b{animation:lampeggiaB 1.6s infinite}
@keyframes lampeggiaA{0%,44%{opacity:1}50%,94%{opacity:0}100%{opacity:1}}
@keyframes lampeggiaB{0%,44%{opacity:0}50%,94%{opacity:1}100%{opacity:0}}

/* caselle: cerchi sopra i numeri */
.casella{
  position:absolute; width:4.4%; aspect-ratio:1; transform:translate(-50%,-50%);
  border:none; border-radius:50%; background:transparent; cursor:pointer; padding:0;
  -webkit-tap-highlight-color:transparent;
}
.casella::before{ /* anello al passaggio del mouse */
  content:""; position:absolute; inset:16%; border-radius:50%;
  box-shadow:0 0 0 0 rgba(255,217,138,0); transition:box-shadow .25s, transform .25s;
}
.casella:hover::before,.casella:focus-visible::before{box-shadow:0 0 0 3px var(--oro),0 0 18px 4px rgba(255,217,138,.6);transform:scale(1.08)}
.casella:focus{outline:none}
.casella .bollino{ /* numero acceso: cerchio giallo come nel design */
  position:absolute; inset:22%; border-radius:50%; display:grid; place-items:center;
  background:#ffe94f; color:#262b4d; font-weight:600; font-size:clamp(7px,1.05vw,20px);
  box-shadow:0 0 0 1px #ffd84a, 0 0 16px 5px rgba(255,210,90,.6);
  transform:scale(0); opacity:0; transition:transform .6s cubic-bezier(.3,1.6,.5,1) .35s, opacity .3s .35s;
}
.casella.aperta .bollino{transform:scale(1);opacity:1}
.casella.ha-luce .bollino{display:none}   /* il numero giallo è già nell'immagine delle luci */
.casella.ha-luce:hover::before{box-shadow:none;transform:none}

/* ---------- case: finestre che si accendono e porticine che si aprono ---------- */
#case > *{position:absolute}
.finestre{opacity:0;transition:opacity .8s ease .4s;pointer-events:none}
.accesa .finestre,.finestre.accesa{opacity:1}
.porta{perspective:220px;cursor:pointer}
.porta img{position:absolute;display:block;pointer-events:none}
.porta .luce{opacity:0;transition:opacity .35s ease .1s}
.porta .anta{left:0;top:0;width:100%;height:100%;transform-origin:left center;
  transition:transform .8s cubic-bezier(.4,1.5,.5,1), filter .8s}
.porta.accesa .luce{opacity:1}
.porta.accesa .anta{transform:rotateY(-68deg);filter:brightness(.8)}
/* hover: la casa si illumina (senza aprire la porta) */
.finestre.hover{opacity:1;transition:opacity .25s ease 0s}
.casella.hover .bollino{transform:scale(1);opacity:1;transition-delay:0s,0s}
/* casa del giorno: le finestre si accendono progressivamente dal basso */
.finestre.oggi{opacity:1;
  -webkit-mask-image:linear-gradient(to top,#000 0 44%,transparent 56% 100%);mask-image:linear-gradient(to top,#000 0 44%,transparent 56% 100%);
  -webkit-mask-size:100% 300%;mask-size:100% 300%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  animation:progressivo 3.6s ease-in-out infinite}
@keyframes progressivo{
  0%{-webkit-mask-position:0 0;mask-position:0 0;opacity:1}
  55%{-webkit-mask-position:0 100%;mask-position:0 100%;opacity:1}
  80%{-webkit-mask-position:0 100%;mask-position:0 100%;opacity:1}
  100%{-webkit-mask-position:0 100%;mask-position:0 100%;opacity:0}}
.finestre.oggi.hover{animation:none;-webkit-mask-image:none;mask-image:none}
.casella.oggi:not(.hover) .bollino{animation:bollinoOggi 3.6s ease-in-out infinite;transition:none}
@keyframes bollinoOggi{0%,30%{opacity:0;transform:scale(.6)}55%,80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
@keyframes pulsa{0%,100%{box-shadow:0 0 0 2px var(--oro),0 0 10px 2px rgba(255,217,138,.5)}50%{box-shadow:0 0 0 4px var(--oro),0 0 26px 8px rgba(255,217,138,.85)}}
.casella.trema{animation:trema .45s}
@keyframes trema{20%,60%{margin-left:-4px}40%,80%{margin-left:4px}}

/* ---------- icone interruttore (stati Off / Hover / On come da design) ---------- */
.icona{position:absolute;width:4.25%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  border:none;background:transparent;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
.icona svg,.ico-btn svg{width:100%;height:100%;display:block;overflow:visible}
.ico .fondo{fill:transparent;transition:fill .25s}
.ico .anello{fill:none;stroke:#c3c3f0;stroke-width:3;transition:stroke .25s}
.ico .barra{stroke:#c3c3f0;stroke-width:3.2;stroke-linecap:round;transition:opacity .2s}
.ico .blu{fill:#5560ab;transition:fill .25s,filter .25s}
.ico .base{fill:#262b55}
.ico .righe{stroke:#9aa0c8;stroke-width:1.4}
.ico .filo{fill:none;stroke:#c9ceff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* Hover */
.icona:hover .ico .fondo,.icona:focus-visible .ico .fondo,.ico-btn:hover .ico .fondo{fill:#f3f2ff}
.icona:hover .ico .barra,.icona:focus-visible .ico .barra,.ico-btn:hover .ico .barra{opacity:0}
.icona:hover .ico .anello,.ico-btn:hover .ico .anello{stroke:#b9b8ef}
/* On */
.attiva .ico .fondo,.attiva:hover .ico .fondo{fill:#3c4364}
.attiva .ico .barra{opacity:0}
.attiva .ico .anello,.attiva:hover .ico .anello{stroke:#b9b8ef}
.attiva .ico-neve .blu{fill:#fff;filter:url(#bagliore)}
.attiva .ico-luna .blu{fill:#f1eeff;filter:url(#bagliore)}
.attiva .ico-luci .blu{fill:#ffd84a;filter:url(#bagliore)}
.attiva .ico-luci .filo{stroke:#fff6cc}
/* sull'immagine lo stato Off è già disegnato: il vettoriale compare solo in Hover / On */
.icona .ico{opacity:0;transition:opacity .2s}
.icona:hover .ico,.icona:focus-visible .ico,.icona.attiva .ico{opacity:1}
.icona:focus{outline:none}
/* pulsanti icona per mobile */
.ico-btn{display:none;width:52px;height:52px;border:none;background:none;padding:0;cursor:pointer;border-radius:50%}
.bonus{position:absolute;left:89%;top:89.8%;width:8.9%;height:6.8%;border-radius:999px;border:none;background:transparent;cursor:pointer}
.bonus::after{content:"";position:absolute;inset:0;border-radius:999px;transition:.3s}
.bonus:hover::after{box-shadow:0 0 18px 4px rgba(201,198,245,.45)}
.bonus.pronto::after{animation:pulsa 1.5s ease-in-out infinite;border-radius:999px}

/* ---------- barra sotto (prove + comandi su mobile) ---------- */
.barra{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:14px 12px 18px}
.btn{font:500 14px 'Jost',sans-serif;color:var(--lilla-chiaro);background:rgba(201,198,245,.08);
  border:1px solid rgba(201,198,245,.3);border-radius:999px;padding:8px 15px;cursor:pointer}
.btn:hover{background:rgba(201,198,245,.18)}
.btn[hidden]{display:none}
.barra{align-items:center}
/* BONUS su telefono: come il pulsante disegnato nell'immagine */
.pill-bonus{font:700 17px/1 'Jost',sans-serif;letter-spacing:.06em;color:#6f80c8;background:transparent;
  border:2.5px solid #c3c3f0;border-radius:999px;height:52px;padding:0 22px;cursor:pointer;transition:background .2s,box-shadow .2s}
.pill-bonus:hover,.pill-bonus:active{background:rgba(201,198,245,.12);box-shadow:0 0 18px 3px rgba(201,198,245,.35)}

/* pulsante "Scarica l'app": una cartolina innevata */
.scarica{flex-basis:100%;max-width:340px;margin:10px auto 0;position:relative;display:flex;align-items:center;gap:12px;
  padding:12px 16px 12px 12px;border:none;border-radius:20px;cursor:pointer;text-align:left;font-family:'Jost',sans-serif;
  background:linear-gradient(180deg,#f3f5ff,#e3e8fd);color:#3b425b;
  box-shadow:0 10px 28px rgba(0,0,0,.35),0 0 0 2px rgba(195,195,240,.6),0 0 26px 2px rgba(255,217,138,.18);
  animation:scaricaIn .8s cubic-bezier(.25,1.5,.45,1) .6s both}
.scarica[hidden]{display:none}
.scarica::before{content:"";position:absolute;left:10px;right:10px;top:-9px;height:20px;border-radius:14px 18px 12px 16px;
  background:linear-gradient(180deg,#d6dbfd,#b3bdf5);clip-path:polygon(0 0,100% 0,100% 55%,88% 70%,74% 52%,60% 75%,44% 58%,30% 78%,14% 60%,0 72%)}
.scarica:hover{transform:translateY(-2px)}
.scarica:active{transform:translateY(1px)}
.scarica{transition:transform .2s}
@keyframes scaricaIn{from{opacity:0;transform:translateY(16px) scale(.95)}}
.scarica-ico{width:46px;height:46px;border-radius:12px;flex:none;box-shadow:0 3px 8px rgba(30,30,80,.3)}
.scarica-testo{display:flex;flex-direction:column;flex:1;line-height:1.15}
.scarica-testo b{font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.03em}
.scarica-testo small{font-size:13px;color:#6f7bb0;margin-top:3px}
.scarica-freccia{width:34px;height:34px;flex:none;padding:6px;border-radius:50%;background:#ffe94f;color:#2c3150;
  box-shadow:0 0 14px 3px rgba(255,217,138,.55);animation:rimbalza 2.4s ease-in-out infinite}
@keyframes rimbalza{0%,70%,100%{transform:none}80%{transform:translateY(3px)}90%{transform:translateY(-1px)}}

/* istruzioni d'installazione: stile bigliettino */
.istruzioni{position:relative;width:min(380px,100%);background:#eef1fd;color:#3b425b;border-radius:10px 10px 22px 18px;
  padding:58px 24px 46px;text-align:center;transform:rotate(-1.2deg);
  box-shadow:0 24px 60px rgba(0,0,0,.5);animation:entra .6s cubic-bezier(.25,1.5,.45,1)}
.istruzioni .neve-top{position:absolute;left:-14px;right:-14px;top:-6px;width:calc(100% + 28px);height:58px;filter:drop-shadow(0 3px 2px rgba(80,90,170,.25))}
.istruzioni .ico-wrap{position:absolute;left:50%;top:-44px;transform:translateX(-50%);width:84px;height:84px;border-radius:22px;
  box-shadow:0 0 0 4px #eef1fd,0 0 30px 8px rgba(255,217,138,.45)}
.istruzioni .ico-app{width:100%;height:100%;border-radius:22px;display:block}
.istruzioni h3{font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.01em;margin:6px 0 16px;line-height:1.2}
.istruzioni ol{text-align:left;padding-left:22px;font-size:16px;line-height:1.5;color:#6f80c8;font-weight:500}
.istruzioni li{margin-bottom:8px}
.istruzioni li::marker{font-weight:700;color:#8a99da}
.istruzioni b{color:#3b425b}
.istruzioni .simbolo{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:#dfe4fb;vertical-align:-6px}
.chiudi-ist{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);width:48px;height:48px;border-radius:50%;padding:12px;
  border:none;background:#0b0f24;box-shadow:0 0 0 3px #b9c0f5;cursor:pointer;transition:transform .2s}
.chiudi-ist:hover{transform:translateX(-50%) scale(1.1)}
.chiudi-ist svg{width:100%;height:100%;display:block}
.btn.attivo{background:var(--oro);color:var(--inchiostro);border-color:var(--oro)}
.solo-mobile{display:none}
.ruota{display:none;align-items:center;gap:10px;margin:14px auto 0;padding:8px 16px 8px 10px;border-radius:999px;
  color:#c9ceff;background:rgba(201,198,245,.08);border:1px solid rgba(201,198,245,.25);font:500 14px 'Jost',sans-serif}
.ruota svg{width:28px;height:28px;flex:none;animation:gira 3.2s ease-in-out infinite}
@keyframes gira{0%,35%{transform:rotate(0)}55%,85%{transform:rotate(-90deg)}100%{transform:rotate(0)}}

/* ---------- biglietto (design: cornice con neve, numero giallo, locandina, titolo) ---------- */
.velo{position:fixed;inset:0;background:rgba(8,6,30,.72);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  display:none;place-items:center;padding:16px;z-index:10}
.velo.visibile{display:grid;animation:appari .3s}
@keyframes appari{from{opacity:0}}
.biglietto{position:relative;width:min(600px,94vw,calc(90vh * 938 / 745));aspect-ratio:938/745;container-type:inline-size;
  filter:drop-shadow(0 24px 40px rgba(0,0,0,.45));animation:entra .7s cubic-bezier(.25,1.5,.45,1)}
@keyframes entra{0%{transform:translateY(60px) scale(.7) rotate(-4deg);opacity:0}60%{opacity:1}100%{transform:none}}
.biglietto .cornice{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.biglietto .num{position:absolute;left:48.83%;top:15.3%;transform:translate(-50%,-50%);
  font:700 8.6cqw/1 'Jost',sans-serif;color:#3d434c;letter-spacing:-.02em;animation:numPop .6s cubic-bezier(.3,1.8,.5,1) .35s both}
@keyframes numPop{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}
.biglietto .poster{position:absolute;left:34.22%;top:36.91%;width:31.77%;aspect-ratio:1;object-fit:cover;display:block;
  animation:posterIn .6s ease .25s both}
@keyframes posterIn{from{opacity:0;transform:scale(.92)}}
.biglietto .tile{position:absolute;left:34.22%;top:36.91%;width:31.77%;aspect-ratio:1;display:grid;place-items:center;
  background:#fff;border-radius:2%;font-size:14cqw}
.biglietto h2{position:absolute;left:15%;right:15%;top:84.2%;transform:translateY(-50%);text-align:center;
  font:700 3.25cqw/1.15 'Jost',sans-serif;color:#3b425b;text-transform:uppercase;letter-spacing:.015em;margin:0}
.biglietto .testo{position:absolute;left:12%;right:12%;top:89%;text-align:center;font:500 2.2cqw/1.3 'Jost',sans-serif;color:#5a6080}
/* bonus: elenco suggerimenti */
.bonus-testo{position:absolute;left:10%;right:10%;top:35.5%;bottom:10%;display:flex;flex-direction:column;align-items:center;
  text-align:center;text-transform:uppercase;font-family:'Jost',sans-serif;animation:posterIn .6s ease .25s both}
.bonus-testo h3{font-weight:700;font-size:3.55cqw;line-height:1.1;color:#3b425b;letter-spacing:.012em;margin:0 0 4.2cqw}
.bonus-testo ul{list-style:none;margin:0;padding:0}
.bonus-testo li,.bonus-testo p{font-weight:600;font-size:1.72cqw;line-height:2.45cqw;color:#7a8ed4;letter-spacing:.02em;margin:0}
.bonus-testo p b{color:#6a7fcf;font-weight:700}
.bonus-testo .att{font-weight:700;font-size:2.05cqw;margin-top:2.1cqw;line-height:2.6cqw}
.bonus-testo u{text-underline-offset:.35cqw;text-decoration-thickness:.18cqw}
.chiudi{position:absolute;left:48.83%;top:95.7%;width:6.8%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  border:none;background:transparent;cursor:pointer;transition:transform .2s}
.chiudi:hover{transform:translate(-50%,-50%) scale(1.12)}
.chiudi:focus-visible{outline:3px solid var(--oro);outline-offset:2px}

.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,40px);opacity:0;z-index:20;pointer-events:none;
  background:var(--carta);color:var(--inchiostro);padding:11px 20px;border-radius:999px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.45);transition:.3s;white-space:nowrap}
.toast.visibile{transform:translate(-50%,0);opacity:1}

/* fumo dai comignoli */
.fumo{position:absolute;width:1.7%;aspect-ratio:1;pointer-events:none;transform:translate(-50%,-50%)}
.sbuffo{position:absolute;left:0;top:0;border-radius:50%;opacity:0;
  background:radial-gradient(circle,rgba(240,238,255,.95) 0%,rgba(225,222,252,.6) 40%,transparent 70%);
  filter:blur(2px);animation:sbuffo var(--d,10s) cubic-bezier(.3,.5,.6,1) infinite;animation-delay:var(--r,0s)}
@keyframes sbuffo{
  0%{transform:translate(0,0) scale(.35);opacity:0}
  15%{opacity:.85}
  60%{opacity:.5}
  100%{transform:translate(var(--dx,90%),-430%) scale(2.2);opacity:0}}

/* neve */
.fiocco{position:absolute;top:-4%;width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:.85;
  pointer-events:none;animation:cadi linear infinite;filter:blur(.4px)}
@keyframes cadi{to{transform:translate(var(--dx),115vh)}}
.neve{position:absolute;inset:0;overflow:hidden;pointer-events:none}

/* ---------- mobile: si inquadra il villaggio ---------- */
@media (max-width:700px) and (orientation:portrait){
  /* tutto il villaggio nella larghezza dello schermo: si mostra solo la zona delle case (x 410–1700, y 0–925) */
  .cornice{max-width:none;overflow:hidden;height:calc(100vw * 1920 / 1290 * 925 / 1920)}
  .scena{width:calc(100vw * 1920 / 1290);margin-left:calc(100vw * -410 / 1290)}
  .casella{width:6%}
  .ruota{display:flex}
  .icona,.bonus{display:none}
  .solo-mobile{display:inline-block}
  .ico-btn{display:inline-block}
}
@media (prefers-reduced-motion:reduce){
  .casella .bollino{transition:none}.fiocco,.casella.oggi .bollino,.sbuffo{animation:none}
  .finestre.oggi{animation:none;-webkit-mask-image:none;mask-image:none}.casella.oggi .bollino{opacity:1;transform:none}
  .scena.luci-on .ghirlanda.a{animation:none;opacity:1}.scena.luci-on .ghirlanda.b{animation:none}
}
</style>
</head>
<body>

<div class="cornice">
  <div class="scena" id="scena">
    <img src="sfondo.jpg" alt="Villaggio innevato di notte con 24 casette numerate">
    <div class="luna-piena"></div>
    <div id="case"></div>
    <img class="ghirlanda a" src="luci-a.png" alt="">
    <img class="ghirlanda b" src="luci-b.png" alt="">
    <div class="lunare"></div>
    <div id="comignoli"></div>
    <div class="neve" id="neve"></div>
    <div id="caselle"></div>
    <button class="icona" data-tipo="neve" style="left:4.583%;top:91.85%"  aria-label="Neve" aria-pressed="false"></button>

function segnaOggi(){

  if (!n || aperte.has(n)) return;
  document.querySelectorAll(`.casella[data-n="${n}"], .finestre[data-casa="${n}"]`).forEach(e => e.classList.add('oggi'));
}
// hover: la casa si illumina senza aprire la porta
function illumina(n, on){
  if (aperte.has(n)) return;
  document.querySelectorAll(`.casella[data-n="${n}"], .finestre[data-casa="${n}"]`).forEach(e => e.classList.toggle('hover', on));
}

function disegna(){
  disegnaCase();

    const [x,y] = POS[n];
    const b = document.createElement('button');
    b.className = 'casella' + (LUCI[n] ? ' ha-luce' : ''); b.dataset.n = n;
    b.style.left = (x/1920*100) + '%'; b.style.top = (y/1080*100) + '%';
    b.setAttribute('aria-label', 'Casella ' + n);
    b.innerHTML = `<span class="bollino">${n}</span>`;
    if (aperte.has(n)) b.classList.add('aperta');
    b.onclick = () => clic(b);
    b.onmouseenter = () => illumina(n, true); b.onmouseleave = () => illumina(n, false);
    box.appendChild(b);
  }
  segnaOggi();
  aggiornaBonus();
}

function clic(b){
  const n = +b.dataset.n;
  if (!sbloccato(n)){
    b.classList.remove('trema'); void b.offsetWidth; b.classList.add('trema');
    const g = Math.ceil((new Date(ANNO,11,n) - new Date()) / 864e5);
    toast(g > 1 ? `Pazienta! Mancano ${g} giorni 🤫` : 'Si apre domani! 🤫');
    return;
  }
  const gia = aperte.has(n);
  aperte.add(n); mem.set('aperte', [...aperte]);
  b.classList.add('aperta'); b.classList.remove('oggi');
  accendi(n);
  segnaOggi();
  aggiornaBonus();
  setTimeout(() => mostra(GIORNI[n], n + ' dicembre', n), gia ? 0 : 1300);
}

function mostra(g, etichetta, numero){

  $('biglietto').classList.toggle('is-bonus', !!g.bonus);

    $('numB').textContent = ''; $('titoloB').textContent = ''; $('testoB').textContent = '';
    $('mediaB').innerHTML = `<div class="bonus-testo">
      <h3>${g.titolo}</h3>
      <ul>${g.lista.map(t => `<li>${t}</li>`).join('')}</ul>
      <p class="att"><u>Attenzione!!!</u></p>
      <p>${g.attenzione}</p>
      <ul>${g.alternative.map(t => `<li>${t}</li>`).join('')}</ul>
    </div>`;
    $('velo').classList.add('visibile'); $('chiudi').focus();
    const b = $('biglietto'); b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
    return;
  }
  $('numB').textContent = numero;
  $('titoloB').textContent = g.titolo || '';
  $('testoB').textContent = g.testo || '';

    ? `<img class="poster" src="${g.poster}" alt="Locandina: ${g.titolo || ''}">`

  $('velo').classList.add('visibile'); $('chiudi').focus();
}

  let richiesta = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); richiesta = e; btn.hidden = false });
  window.addEventListener('appinstalled', () => { btn.hidden = true; toast('App installata! 🎄') });
  if (iOS || android) btn.hidden = false;
  const condividiIOS = '<span class="simbolo"><svg width="14" height="16" viewBox="0 0 14 16" fill="none" stroke="#3b425b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10V1M3.5 4.5 7 1l3.5 3.5M4 7H2v8h10V7h-2"/></svg></span>';
  btn.onclick = async () => {
    if (richiesta){ richiesta.prompt(); const r = await richiesta.userChoice; richiesta = null; if (r.outcome === 'accepted') btn.hidden = true; return }
    const passi = iOS ? [
      'Apri questa pagina in <b>Safari</b>.',
      `Tocca il pulsante <b>Condividi</b> ${condividiIOS} in basso.`,
      'Scorri e scegli <b>“Aggiungi alla schermata Home”</b>.',
      'Tocca <b>Aggiungi</b>: l’icona del villaggio comparirà tra le tue app.'
    ] : android ? [
      'Apri questa pagina in <b>Chrome</b>.',
      'Tocca il menu <b>⋮</b> in alto a destra.',
      'Scegli <b>“Installa app”</b> oppure <b>“Aggiungi a schermata Home”</b>.',
      'Conferma: l’icona del villaggio comparirà tra le tue app.'
    ] : [
      'Apri questo link dal <b>telefono</b>.',
      'Su iPhone: Safari → Condividi → <b>“Aggiungi alla schermata Home”</b>.',
      'Su Android: Chrome → menu ⋮ → <b>“Installa app”</b>.'
    ];
    $('passiInst').innerHTML = passi.map(p => `<li>${p}</li>`).join('');
    $('veloInstalla').classList.add('visibile');
  };
  const chiudiI = () => $('veloInstalla').classList.remove('visibile');
  $('chiudiInst').onclick = chiudiI;
  $('veloInstalla').onclick = e => { if (e.target.id === 'veloInstalla') chiudiI() };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') chiudiI() });
})();

// app installabile: memorizzazione offline (solo quando è pubblicata sul proprio sito)
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  try { navigator.serviceWorker.register('sw.js').catch(() => {}) } catch(e){}
}
</script>
